name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Verify Compose tooling for configuration tests
        run: docker compose version

      - name: Tests
        run: uv run pytest -q

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --extra s3 --extra pg --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uvx pip-audit --disable-pip --no-deps -r /tmp/runtime-requirements.txt
